<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Выезды ALL TOUR</title>
<style>body{margin:0;background:#f8f7f2;color:#263e34;font:16px/1.5 system-ui,sans-serif}main{max-width:1100px;margin:auto;padding:40px 20px}h1{font-size:32px;margin:0}p{max-width:760px;color:#526357}fieldset{border:1px solid #d8ded5;border-radius:16px;padding:24px;background:white;margin:24px 0}legend{font-weight:700;padding:0 8px}.fields{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}label{display:block;font-size:14px}input,select,button{font:inherit}input,select{box-sizing:border-box;width:100%;padding:10px;border:1px solid #aab8ac;border-radius:8px;margin-top:5px}button{min-height:44px;border:1px solid #809783;border-radius:10px;padding:10px 18px;background:white;color:#263e34;cursor:pointer}.actions{display:flex;gap:12px;flex-wrap:wrap;position:sticky;bottom:0;background:#f8f7f2;padding:16px 0}button[type=submit]{background:#335b49;color:white}button:disabled{opacity:.6;cursor:wait}:focus-visible{outline:3px solid #b25b42;outline-offset:3px}#status{white-space:pre-wrap;color:#8f3c28}small{display:block;color:#526357;margin-top:8px}@media(max-width:700px){.fields{grid-template-columns:1fr}main{padding-top:24px}}</style></head>
<body><main><h1>Выезды ALL TOUR</h1><p>Редактор работает на этом компьютере. Указывайте даты и цены только из проверенной публикации. Пустая цена означает «по запросу». Сохранение обновляет локальный файл; новая версия сайта публикуется отдельно.</p><form id="editor"><div id="records"></div><p id="status" role="status" aria-live="polite"></p><div class="actions"><button id="add" type="button">Добавить выезд</button><button type="submit">Сохранить изменения</button></div></form><noscript>Для редактора нужен JavaScript. Данные также доступны в src/data/departures.json.</noscript></main>
<script type="module">
let state, busy=false;
const records=document.querySelector('#records'), status=document.querySelector('#status');
const esc=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const field=(name,label,value,type='text',required=true)=>`<label>${label}<input name="${name}" type="${type}" value="${esc(value)}" ${required?'required':''} ${type==='number'?'min="1" step="1"':''}></label>`;
function render(){records.innerHTML=state.records.map((item,index)=>`<fieldset data-id="${esc(item.id)}"><legend>Выезд ${index+1}</legend><div class="fields"><label>Тур<select name="tourId">${state.tours.map(t=>`<option value="${esc(t.id)}" ${t.id===item.tourId?'selected':''}>${esc(t.title)}</option>`).join('')}</select></label>${field('startDate','Начало поездки',item.startDate,'date')}${field('endDate','Конец поездки',item.endDate,'date')}${field('publishedPriceKzt','Цена в публикации, ₸',item.publishedPriceKzt,'number',false)}<label>Статус<select name="status">${[['announced','Анонсирован'],['sold_out','Мест нет'],['cancelled','Отменён']].map(([v,l])=>`<option value="${v}" ${v===item.status?'selected':''}>${l}</option>`).join('')}</select></label>${field('sourceUrl','Ссылка на источник',item.sourceUrl,'url')}${field('sourcePublishedAt','Дата публикации',item.sourcePublishedAt,'date',false)}${field('checkedAt','Когда проверен источник',item.checkedAt,'date')}</div><small>Идентификатор: ${esc(item.id)}</small><button type="button" data-remove="${esc(item.id)}">Убрать из списка</button></fieldset>`).join('')}
function collect(){return [...records.querySelectorAll('fieldset')].map(row=>{const value=name=>row.querySelector(`[name="${name}"]`).value;return {id:row.dataset.id,tourId:value('tourId'),startDate:value('startDate'),endDate:value('endDate'),publishedPriceKzt:value('publishedPriceKzt')?Number(value('publishedPriceKzt')):null,status:value('status'),sourceUrl:value('sourceUrl'),sourcePublishedAt:value('sourcePublishedAt')||null,checkedAt:value('checkedAt')}})}
document.querySelector('#add').onclick=()=>{state.records=collect();state.records.push({id:'departure-'+crypto.randomUUID(),tourId:state.tours[0].id,startDate:'',endDate:'',publishedPriceKzt:null,status:'announced',sourceUrl:'https://www.instagram.com/all_tour.kz/',sourcePublishedAt:null,checkedAt:new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Qyzylorda',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date())});render();records.lastElementChild.querySelector('select').focus()};
records.onclick=event=>{const button=event.target.closest('[data-remove]');if(!button)return;state.records=collect().filter(r=>r.id!==button.dataset.remove);render();status.textContent='Выезд убран из формы. Сохраните изменения, чтобы обновить файл.'};
document.querySelector('#editor').onsubmit=async event=>{event.preventDefault();if(busy)return;busy=true;const button=event.target.querySelector('[type="submit"]');button.disabled=true;status.textContent='Сохранение…';try{const next=collect();const response=await fetch('/content',{method:'PUT',headers:{'Content-Type':'application/json','X-Alltour-Editor':'1'},body:JSON.stringify({records:next,revision:state.revision})});const result=await response.json();if(!response.ok)throw new Error(result.error);state.records=next;state.revision=result.revision;status.textContent='Сохранено локально. Проверьте сайт и выполните новую сборку перед публикацией.'}catch(error){status.textContent=error.message}finally{busy=false;button.disabled=false}};
try{const response=await fetch('/content');if(!response.ok)throw new Error('Не удалось загрузить выезды.');state=await response.json();render()}catch(error){status.textContent=error.message;document.querySelector('#add').disabled=true;document.querySelector('[type="submit"]').disabled=true}
</script></body></html>
