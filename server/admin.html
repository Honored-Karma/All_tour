<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Заявки · ALL TOUR</title>
<style>body{margin:0;font:16px/1.5 system-ui,sans-serif;background:#f8f7f2;color:#263e34}main{max-width:1150px;margin:auto;padding:32px 20px}h1{margin:0;font-size:32px}header p,.muted{color:#59675c}form{display:flex;gap:12px;flex-wrap:wrap;margin:24px 0}input,select,textarea,button{font:inherit;padding:10px 12px;border:1px solid #a6b5aa;border-radius:9px;background:white;color:inherit;box-sizing:border-box}input{min-width:230px}button{min-height:44px;cursor:pointer}button.primary{background:#355b49;color:white;border-color:#355b49}button:disabled{opacity:.6;cursor:wait}article{padding:24px;background:white;border:1px solid #d9dfd8;border-radius:16px;margin:18px 0}h2{font-size:20px;margin:0}.lead-header{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}.details{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin:20px 0}dt{font-size:12px;color:#667469}dd{margin:4px 0 0;overflow-wrap:anywhere}.comment{white-space:pre-wrap;overflow-wrap:anywhere;padding:16px;background:#f3f5ef;border-radius:10px}.edit{display:grid;grid-template-columns:220px 1fr auto;gap:16px;align-items:end}label{font-size:13px}label select,label textarea{display:block;width:100%;margin-top:6px}textarea{min-height:80px}.pager{display:flex;gap:16px;align-items:center;margin:24px 0}.error{color:#9e452e;white-space:pre-wrap}:focus-visible{outline:3px solid #b35d43;outline-offset:3px}@media(max-width:700px){.details{grid-template-columns:1fr 1fr}.edit{grid-template-columns:1fr}article{padding:18px}input{min-width:0;width:100%}}</style></head>
<body><main><header><h1>Заявки ALL TOUR</h1><p>Локальная панель. Здесь сохраняются обращения до перехода в WhatsApp. Изменение статуса не отправляет сообщения клиенту.</p></header><form id="filters"><label>Статус <select id="filter-status"><option value="">Все</option></select></label><label>Поиск <input id="search" type="search" placeholder="Имя, телефон или номер заявки" maxlength="100"></label><button type="submit">Найти</button><button type="button" id="refresh">Обновить</button></form><p id="summary" role="status" aria-live="polite"></p><p id="error" class="error" role="alert"></p><div id="list"></div><nav class="pager" aria-label="Страницы заявок"><button id="prev">Назад</button><span id="page"></span><button id="next">Далее</button></nav><noscript>Для работы панели нужен JavaScript.</noscript></main>
<script type="module">
const labels={new:'Новая',contacted:'Связались',proposal:'Предложение отправлено',confirmed:'Подтверждена',closed:'Закрыта'};
const esc=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const format=value=>new Date(value).toLocaleString('ru-RU',{timeZone:'Asia/Qyzylorda'});
const list=document.querySelector('#list'),error=document.querySelector('#error'),summary=document.querySelector('#summary');let page=0,records=[];
document.querySelector('#filter-status').insertAdjacentHTML('beforeend',Object.entries(labels).map(([v,l])=>`<option value="${v}">${l}</option>`).join(''));
async function load(){error.textContent='';summary.textContent='Загрузка заявок…';try{const query=new URLSearchParams({status:document.querySelector('#filter-status').value,q:document.querySelector('#search').value,page:String(page)});const response=await fetch('/api/admin/leads?'+query,{headers:{'X-Alltour-Admin':'1'}});const result=await response.json();if(!response.ok)throw new Error(result.error);records=result.records;summary.textContent=`Всего заявок: ${result.total}`;document.querySelector('#page').textContent=`Страница ${page+1}`;document.querySelector('#prev').disabled=page===0;document.querySelector('#next').disabled=(page+1)*50>=result.total;render()}catch(failure){error.textContent=failure.message;summary.textContent='Не удалось загрузить список.'}}
function render(){list.innerHTML=records.length?records.map(lead=>{const i=lead.input;return `<article data-id="${esc(lead.id)}"><div class="lead-header"><div><h2>${esc(i.name)}</h2><span class="muted">${esc(lead.id)} · ${esc(format(lead.created_at))}</span></div><strong>${labels[lead.status]}</strong></div><dl class="details"><div><dt>Телефон / WhatsApp</dt><dd><a href="tel:${esc(i.contact.replace(/[^+\d]/g,''))}">${esc(i.contact)}</a></dd></div><div><dt>Направление и тур</dt><dd>${esc(i.tourTitle||i.destinationName||'Консультация')}</dd></div><div><dt>Желаемые даты</dt><dd>${esc(i.desiredDate||'Обсудить с клиентом')}</dd></div><div><dt>Путешественников</dt><dd>${esc(i.travelersCount)}</dd></div><div><dt>Язык</dt><dd>${i.locale==='kz'?'Қазақша':'Русский'}</dd></div><div><dt>Обновлено</dt><dd>${esc(format(lead.updated_at))}</dd></div><div><dt>Источник обращения</dt><dd>${esc(Object.entries(i.attribution||{}).map(([key,value])=>key+": "+value).join(" · ")||"Прямой переход")}</dd></div></dl>${i.comment?`<p class="comment">${esc(i.comment)}</p>`:''}<div class="edit"><label>Статус<select name="status">${Object.entries(labels).map(([value,label])=>`<option value="${value}" ${value===lead.status?'selected':''}>${label}</option>`).join('')}</select></label><label>Заметка менеджера<textarea name="notes" maxlength="4000">${esc(lead.notes)}</textarea></label><button class="primary" data-save="${esc(lead.id)}">Сохранить</button></div><p class="result" role="status"></p></article>`}).join(''):'<p class="muted">Заявок по выбранным условиям пока нет. Измените фильтры или заполните форму на локальном сайте.</p>'}
document.querySelector('#filters').onsubmit=event=>{event.preventDefault();page=0;load()};document.querySelector('#refresh').onclick=load;document.querySelector('#prev').onclick=()=>{page=Math.max(0,page-1);load()};document.querySelector('#next').onclick=()=>{page++;load()};
list.onclick=async event=>{const button=event.target.closest('[data-save]');if(!button||button.disabled)return;const lead=records.find(item=>item.id===button.dataset.save),card=button.closest('article'),result=card.querySelector('.result');button.disabled=true;result.textContent='Сохранение…';try{const response=await fetch('/api/admin/leads/'+lead.id,{method:'PATCH',headers:{'Content-Type':'application/json','X-Alltour-Admin':'1'},body:JSON.stringify({status:card.querySelector('[name=status]').value,notes:card.querySelector('[name=notes]').value,version:lead.version})});const body=await response.json();if(!response.ok)throw new Error(body.error);await load();summary.textContent='Изменения сохранены.'}catch(failure){result.textContent=failure.message;button.disabled=false}};
load();
</script></body></html>
